# Publishes the browser version (node tools/build-web.js) to GitHub Pages on
# every push to main. No game files are involved: visitors use their own copy.
name: Publish the browser version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The resizable game window (tools/window/WB2Window.cs), built with the C#
  # compiler that comes with Windows.
  window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -e "if (!require('./tools/window').ensureWrapper()) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: wb2window
          path: build/WB2Window.exe

  build:
    needs: window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wb2window
          path: window-build
      - run: node tools/build-web.js
        env:
          WB2WINDOW_EXE: window-build/WB2Window.exe
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
